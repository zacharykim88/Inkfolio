name: Publish Inkfolio v1.0.0
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v1.0.0.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-inkfolio-v1.0.0
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify installation package and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/Inkfolio-v1.0.0.zip"
          curl --fail --location --silent --show-error "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/dist/Inkfolio-v1.0.0.zip" --output "$package"
          printf '%s  %s\n' 'f6e63c5d4321bad030fe4cc6ce249e73c5063474ba6104a09fb6286d3500f390' "$package" | sha256sum --check
          unzip -t "$package"
          notes="$RUNNER_TEMP/release-notes.md"
          cat > "$notes" <<'NOTES'
          墨笺 · Inkfolio 首个正式版本，由 zacharykim88 二次开发与设计。

          - 电影票根风格阅读信息与休眠壁纸，支持阅读界面和主页。
          - 图书信息、城市天气、阅读摘要、状态邮戳及自定义底部文字。
          - 外观实时预览，可调整宽度、字号、比例和背景。
          - 完整安装包包含 Lua 补丁、两款字体、授权文件和安装说明。

          安装与适配范围请阅读仓库 README。此前版本在 Kobo Sage 上经过真机测试，最终修改及其他设备仍需用户验证。
          NOTES
          gh release create v1.0.0 "$package" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title '墨笺 · Inkfolio v1.0.0' --notes-file "$notes" --latest
